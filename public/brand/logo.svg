<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <style>
    .wordmark { fill: #16356b; }
    .tagline { fill: #3c4557; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #dbe4f5; }
      .tagline { fill: #8b94a7; }
    }
  </style>

  <!-- The Icon (Positioned to the left) -->
  <g transform="translate(20, 20) scale(2)">
    <circle cx="42" cy="40" r="24" stroke="#10d48e" stroke-width="2.5"/>
    <g stroke="#10d48e" stroke-opacity="0.6" stroke-width="0.8">
      <line x1="42" y1="40" x2="30" y2="32"/><line x1="42" y1="40" x2="55" y2="28"/>
      <line x1="42" y1="40" x2="60" y2="45"/><line x1="42" y1="40" x2="32" y2="55"/>
    </g>
    <circle cx="42" cy="40" r="3.5" fill="#10d48e"/>
    <circle cx="30" cy="32" r="4.2" fill="#10d48e"/>
    <circle cx="55" cy="28" r="4.5" fill="#10d48e"/>
    <circle cx="60" cy="45" r="5.2" fill="#10d48e"/>
    <circle cx="32" cy="55" r="4.8" fill="#10d48e"/>
    <circle cx="50" cy="58" r="5.5" fill="#10d48e"/>
    <rect x="58" y="58" width="6" height="4" transform="rotate(45 61 60)" fill="#10d48e"/>
    <g transform="rotate(45 42 40)">
       <line x1="42" y1="64" x2="42" y2="78" stroke="#10d48e" stroke-width="2.2" stroke-linecap="round"/>
       <line x1="48" y1="64" x2="48" y2="78" stroke="#10d48e" stroke-width="2.2" stroke-linecap="round"/>
       <path d="M42 64 Q45 61 48 64" stroke="#10d48e" stroke-width="2.2" fill="none"/>
    </g>
    <circle cx="78" cy="78" r="4.5" fill="#10d48e"/>
  </g>

  <!-- Wordmark -->
  <text x="240" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="120" font-weight="800" letter-spacing="-4">
    <tspan fill="#10d48e">D</tspan><tspan class="wordmark">search</tspan>
  </text>

  <!-- Tagline -->
  <text x="245" y="170" class="tagline" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">
    The community-driven search engine.
  </text>
  <text x="245" y="200" class="tagline" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">
    Powered by Nostr, owned by no one.
  </text>
</svg>
