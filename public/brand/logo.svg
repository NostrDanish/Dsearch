<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <!-- Dsearch lockup — the app logo mark + wordmark + tagline.
       Static master: hardcoded brand colors (var() doesn't work in <img>). -->
  <style>
    .wordmark { fill: #16356b; }
    .tagline { fill: #3c4557; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #dbe4f5; }
      .tagline { fill: #8b94a7; }
    }
  </style>

  <!-- The mark (identical geometry to the app logo) -->
  <g transform="translate(10, 20) scale(2)">
    <circle cx="42" cy="40" r="24" stroke="#10d48e" stroke-width="3"/>
    <circle cx="42" cy="40" r="19" stroke="#1d4e9e" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="80 30" transform="rotate(-30 42 40)"/>
    <g stroke="#10d48e" stroke-opacity="0.6" stroke-width="0.8">
      <line x1="42" y1="40" x2="30" y2="32"/>
      <line x1="42" y1="40" x2="55" y2="28"/>
      <line x1="42" y1="40" x2="60" y2="45"/>
      <line x1="42" y1="40" x2="32" y2="55"/>
      <line x1="30" y1="32" x2="55" y2="28"/>
      <line x1="55" y1="28" x2="60" y2="45"/>
      <line x1="60" y1="45" x2="50" y2="58"/>
      <line x1="32" y1="55" x2="50" y2="58"/>
      <line x1="30" y1="32" x2="32" y2="55"/>
    </g>
    <circle cx="42" cy="40" r="3.5" fill="#10d48e"/>
    <circle cx="30" cy="32" r="4.2" fill="#10d48e"/>
    <circle cx="55" cy="28" r="4.5" fill="#10d48e"/>
    <circle cx="60" cy="45" r="5.2" fill="#10d48e"/>
    <circle cx="32" cy="55" r="4.8" fill="#10d48e"/>
    <circle cx="50" cy="58" r="5.5" fill="#10d48e"/>
    <circle cx="42" cy="25" r="2.2" fill="#1d4e9e"/>
    <circle cx="68" cy="35" r="1.8" fill="#1d4e9e"/>
    <circle cx="35" cy="45" r="2.5" fill="#1d4e9e"/>
    <rect x="58" y="58" width="6" height="4" transform="rotate(45 61 60)" fill="#10d48e"/>
    <g transform="rotate(-45 42 40)">
      <line x1="42" y1="64" x2="42" y2="82" stroke="#10d48e" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="64" x2="50" y2="82" stroke="#10d48e" stroke-width="3" stroke-linecap="round"/>
      <path d="M42 64 Q46 60 50 64" stroke="#10d48e" stroke-width="3" fill="none"/>
    </g>
    <circle cx="78" cy="78" r="6" fill="#10d48e"/>
    <path d="M85 15 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 z" fill="#3f7bdc"/>
    <path d="M15 75 l1 2.5 2.5 1 -2.5 1 -1 2.5 -1 -2.5 -2.5 -1 2.5 -1 z" fill="#10d48e"/>
  </g>

  <!-- Wordmark -->
  <text x="240" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="120" font-weight="800" letter-spacing="-4">
    <tspan fill="#10d48e">D</tspan><tspan class="wordmark">search</tspan>
  </text>

  <!-- Tagline -->
  <text x="245" y="170" class="tagline" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">The community-driven search engine.</text>
  <text x="245" y="200" class="tagline" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">Powered by Nostr, owned by no one.</text>
</svg>
