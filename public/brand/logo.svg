<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <!-- Dsearch lockup — the approved app icon + wordmark + tagline.
       The icon IS the install image (embedded reference). -->
  <style>
    .wordmark { fill: #16356b; }
    .tagline { fill: #3c4557; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #dbe4f5; }
      .tagline { fill: #8b94a7; }
    }
  </style>

  <!-- The mark: the approved app install icon -->
  <image href="/brand/icon-1024.png" x="20" y="28" width="144" height="144"/>

  <!-- Wordmark -->
  <text x="190" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
    <tspan fill="#10d48e">D</tspan><tspan class="wordmark">search</tspan>
  </text>

  <!-- Tagline -->
  <text x="192" y="150" class="tagline" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16.5">The community-driven search engine. Powered by Nostr, owned by no one.</text>
</svg>
