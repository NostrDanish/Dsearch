<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="lensshine" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f0b45a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon tile: night-navy rounded square -->
  <rect width="64" height="64" rx="16" fill="#070b1a"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#f0b45a" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Lens glow -->
  <circle cx="26" cy="26" r="18" fill="url(#lensshine)"/>

  <!-- The index inside the lens: a five-node mesh (pentagon graph) -->
  <g stroke="#f0b45a" stroke-opacity="0.6" stroke-width="1.3">
    <!-- spokes from the center node -->
    <line x1="26" y1="26" x2="19.9" y2="21.1"/>
    <line x1="26" y1="26" x2="32.1" y2="21.1"/>
    <line x1="26" y1="26" x2="21.4" y2="32.4"/>
    <line x1="26" y1="26" x2="30.6" y2="32.4"/>
    <!-- ring edges -->
    <line x1="19.9" y1="21.1" x2="32.1" y2="21.1"/>
    <line x1="19.9" y1="21.1" x2="21.4" y2="32.4"/>
    <line x1="32.1" y1="21.1" x2="30.6" y2="32.4"/>
    <line x1="21.4" y1="32.4" x2="30.6" y2="32.4"/>
  </g>
  <circle cx="26" cy="26" r="2.1" fill="#f0b45a"/>
  <circle cx="19.9" cy="21.1" r="1.8" fill="#f0b45a"/>
  <circle cx="32.1" cy="21.1" r="1.8" fill="#f0b45a"/>
  <circle cx="21.4" cy="32.4" r="1.8" fill="#f0b45a"/>
  <circle cx="30.6" cy="32.4" r="1.8" fill="#f0b45a"/>

  <!-- Magnifying glass: ring + elongated hollow handle -->
  <circle cx="26" cy="26" r="13.5" stroke="#f0b45a" stroke-width="3.4"/>
  <line x1="35.5" y1="35.5" x2="39.2" y2="39.2" stroke="#f0b45a" stroke-width="5.6" stroke-linecap="round"/>
  <rect x="38" y="44.2" width="6.4" height="14.6" rx="3.2" transform="rotate(-45 41.2 51.5)" stroke="#f0b45a" stroke-width="2.4"/>
</svg>
