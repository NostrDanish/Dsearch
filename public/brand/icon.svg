<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Dsearch mark — a magnifying glass revealing a node network shaped like "D".
       Static master: hardcoded brand colors (CSS vars don't resolve in
       standalone SVG documents). Geometry identical to LogoMark.tsx. -->

  <!-- ── Handle: hollow tube + open ring tip (drawn under the lens) ── -->
  <line x1="593" y1="559" x2="682" y2="648" stroke="#17a398" stroke-width="15" stroke-linecap="round"/>
  <line x1="609" y1="543" x2="698" y2="632" stroke="#17a398" stroke-width="15" stroke-linecap="round"/>
  <circle cx="706" cy="656" r="22" stroke="#17a398" stroke-width="15"/>

  <!-- ── Lens ring ── -->
  <circle cx="470" cy="420" r="185" stroke="#17a398" stroke-width="17"/>

  <!-- ── Outrider stems (corona radiating from the D) ── -->
  <g stroke="#17a398" stroke-width="4.5" stroke-opacity="0.85">
    <line x1="400" y1="330" x2="356" y2="296"/>
    <line x1="398" y1="392" x2="336" y2="378"/>
    <line x1="400" y1="452" x2="342" y2="462"/>
    <line x1="404" y1="508" x2="366" y2="548"/>
    <line x1="452" y1="516" x2="436" y2="566"/>
    <line x1="512" y1="484" x2="530" y2="540"/>
    <line x1="538" y1="428" x2="590" y2="452"/>
    <line x1="530" y1="368" x2="584" y2="344"/>
    <line x1="470" y1="318" x2="486" y2="272"/>
    <line x1="436" y1="320" x2="410" y2="272"/>
  </g>

  <!-- ── The "D": stem + bowl, wired as a node graph ── -->
  <g stroke="#17a398" stroke-width="5.5" stroke-linecap="round">
    <!-- stem -->
    <line x1="400" y1="330" x2="398" y2="392"/>
    <line x1="398" y1="392" x2="400" y2="452"/>
    <line x1="400" y1="452" x2="404" y2="508"/>
    <!-- top edge into the bowl -->
    <line x1="400" y1="330" x2="436" y2="320"/>
    <line x1="436" y1="320" x2="470" y2="318"/>
    <line x1="470" y1="318" x2="504" y2="334"/>
    <line x1="504" y1="334" x2="530" y2="368"/>
    <!-- bowl right -->
    <line x1="530" y1="368" x2="538" y2="428"/>
    <line x1="538" y1="428" x2="512" y2="484"/>
    <!-- bottom edge back to the stem -->
    <line x1="512" y1="484" x2="452" y2="516"/>
    <line x1="452" y1="516" x2="404" y2="508"/>
    <!-- inner cross-links (the mesh feel) -->
    <line x1="398" y1="392" x2="470" y2="318"/>
    <line x1="398" y1="392" x2="466" y2="404"/>
    <line x1="466" y1="404" x2="530" y2="368"/>
    <line x1="466" y1="404" x2="538" y2="428"/>
    <line x1="466" y1="404" x2="452" y2="516"/>
    <line x1="400" y1="452" x2="466" y2="404"/>
    <line x1="400" y1="452" x2="452" y2="516"/>
    <line x1="504" y1="334" x2="466" y2="404"/>
    <line x1="512" y1="484" x2="466" y2="404"/>
  </g>

  <!-- ── D-path nodes (teal) ── -->
  <circle cx="400" cy="330" r="13" fill="#17a398"/>
  <circle cx="398" cy="392" r="11" fill="#17a398"/>
  <circle cx="400" cy="452" r="13" fill="#17a398"/>
  <circle cx="404" cy="508" r="11" fill="#17a398"/>
  <circle cx="436" cy="320" r="10" fill="#17a398"/>
  <circle cx="470" cy="318" r="12" fill="#17a398"/>
  <circle cx="504" cy="334" r="10" fill="#17a398"/>
  <circle cx="530" cy="368" r="12" fill="#17a398"/>
  <circle cx="538" cy="428" r="13" fill="#17a398"/>
  <circle cx="512" cy="484" r="12" fill="#17a398"/>
  <circle cx="452" cy="516" r="11" fill="#17a398"/>
  <circle cx="466" cy="404" r="12" fill="#17a398"/>

  <!-- ── Outrider nodes (navy + teal alternating) ── -->
  <circle cx="356" cy="296" r="12" fill="#1b3a7a"/>
  <circle cx="336" cy="378" r="11" fill="#17a398"/>
  <circle cx="342" cy="462" r="12" fill="#1b3a7a"/>
  <circle cx="366" cy="548" r="12" fill="#1b3a7a"/>
  <circle cx="436" cy="566" r="12" fill="#1b3a7a"/>
  <circle cx="530" cy="540" r="11" fill="#17a398"/>
  <circle cx="590" cy="452" r="12" fill="#17a398"/>
  <circle cx="584" cy="344" r="12" fill="#1b3a7a"/>
  <circle cx="486" cy="272" r="11" fill="#17a398"/>
  <circle cx="410" cy="272" r="12" fill="#1b3a7a"/>

  <!-- ── Navy micro-dots woven into the mesh ── -->
  <circle cx="432" cy="366" r="7" fill="#1b3a7a"/>
  <circle cx="500" cy="440" r="7" fill="#1b3a7a"/>
  <circle cx="430" cy="470" r="6" fill="#1b3a7a"/>
</svg>
