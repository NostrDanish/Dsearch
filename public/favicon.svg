<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Dsearch favicon — the D-network mark, simplified + heavier strokes for 16-32px -->
  <g transform="translate(512 512) scale(1.5) translate(-470 -420)">
    <!-- handle -->
    <line x1="596" y1="556" x2="678" y2="638" stroke="#17a398" stroke-width="26" stroke-linecap="round"/>
    <line x1="614" y1="538" x2="696" y2="620" stroke="#17a398" stroke-width="26" stroke-linecap="round"/>
    <circle cx="706" cy="650" r="24" stroke="#17a398" stroke-width="24"/>
    <!-- lens -->
    <circle cx="470" cy="420" r="185" stroke="#17a398" stroke-width="30"/>
    <!-- the D, reduced to its skeleton -->
    <g stroke="#17a398" stroke-width="16" stroke-linecap="round">
      <line x1="404" y1="330" x2="404" y2="510"/>
      <line x1="404" y1="330" x2="470" y2="318"/>
      <line x1="470" y1="318" x2="530" y2="368"/>
      <line x1="530" y1="368" x2="538" y2="428"/>
      <line x1="538" y1="428" x2="500" y2="492"/>
      <line x1="500" y1="492" x2="404" y2="510"/>
    </g>
    <circle cx="404" cy="330" r="26" fill="#17a398"/>
    <circle cx="404" cy="510" r="26" fill="#17a398"/>
    <circle cx="470" cy="318" r="24" fill="#17a398"/>
    <circle cx="530" cy="368" r="24" fill="#17a398"/>
    <circle cx="538" cy="428" r="26" fill="#17a398"/>
    <circle cx="500" cy="492" r="24" fill="#17a398"/>
    <circle cx="404" cy="420" r="20" fill="#1b3a7a"/>
    <!-- a few outriders -->
    <circle cx="340" cy="300" r="20" fill="#1b3a7a"/>
    <circle cx="596" cy="440" r="20" fill="#17a398"/>
    <circle cx="440" cy="580" r="20" fill="#1b3a7a"/>
  </g>
</svg>
