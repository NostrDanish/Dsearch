  <line x1="17.75" y1="17.75" x2="19.6" y2="19.6" stroke="#f0b45a" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="18.9" y="21.7" width="3.2" height="7.6" rx="1.6" transform="rotate(-45 20.5 25.5)" stroke="#f0b45a" stroke-width="1.3"/>
