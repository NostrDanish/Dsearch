<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self'; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss: ws://*.onion; img-src 'self' data: blob: https:; media-src 'self' https:">
        <meta name="theme-color" content="#f0b45a">
        <meta name="description" content="Dsearch — The community-driven search engine. Powered by Nostr, owned by no one. A community web index on Nostr (SIP-01), open crawlers and indexers, and privacy-first results across Nostr, the clearnet, and dark web services.">
        <!-- Open Graph -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Dsearch">
        <meta property="og:title" content="Dsearch — The community-driven search engine">
        <meta property="og:description" content="The community-driven search engine. Powered by Nostr, owned by no one. Search it, crawl it, index it, relay it, build on it.">
        <meta property="og:url" content="https://dsearch.com/">
        <meta property="og:image" content="https://dsearch.com/og.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Dsearch — The community-driven search engine">
        <meta name="twitter:description" content="The community-driven search engine. Powered by Nostr, owned by no one.">
        <meta name="twitter:image" content="https://dsearch.com/og.jpg">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/brand/icon-1024.png">
        <link rel="manifest" href="/manifest.webmanifest">
        <link rel="search" type="application/opensearchdescription+xml" title="Dsearch" href="/opensearch.xml">
        <title>Dsearch — The community-driven search engine</title>
    </head>
    <body>
        <div id="root">
            <!-- Boot placeholder: replaced the moment React mounts. If the JS
                 bundle fails to load (e.g. a stale cached page referencing a
                 deleted build), the user sees this instead of a white screen. -->
            <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:hsl(222 47% 6%);color:hsl(210 40% 96%);font-family:ui-sans-serif,system-ui,sans-serif;padding:24px;text-align:center;">
                <div style="width:40px;height:40px;border-radius:12px;border:1px solid hsl(38 92% 60% / 0.4);background:hsl(38 92% 60% / 0.12);display:flex;align-items:center;justify-content:center;">
                    <span style="font-family:ui-monospace,monospace;font-weight:700;color:hsl(38 92% 68%);">D</span>
                </div>
                <p style="margin:0;font-size:15px;color:hsl(215 20% 65%);">Loading Dsearch&hellip;</p>
                <p style="margin:0;font-size:12px;color:hsl(215 20% 45%);max-width:320px;">
                    If this doesn't go away, hard-refresh the page
                    (<kbd style="font-family:ui-monospace,monospace;border:1px solid hsl(222 20% 25%);border-radius:4px;padding:1px 5px;">Ctrl</kbd>+<kbd style="font-family:ui-monospace,monospace;border:1px solid hsl(222 20% 25%);border-radius:4px;padding:1px 5px;">Shift</kbd>+<kbd style="font-family:ui-monospace,monospace;border:1px solid hsl(222 20% 25%);border-radius:4px;padding:1px 5px;">R</kbd>)
                    to clear a stale cached build.
                </p>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
